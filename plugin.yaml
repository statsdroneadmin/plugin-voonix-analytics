sync:
  script: src/voonix_analytics_sync.py
  schedule: "0 */6 * * *"
  supports_incremental: false
  execution_mode: async
  concurrency_policy: skip_if_running
  # First sync = up to history_months × 5 report calls; allow for slow accounts.
  timeout_seconds: 7200


hooks:
  on_credentials_saved: hooks.lifecycle:on_credentials_saved
  on_first_run_success: hooks.lifecycle:on_first_run_success


actions:
  - id: test_connection
    label: Test connection
    slot: settings_tab_footer
    style: secondary
    icon: check-circle
    endpoint: POST /api/plugins/voonix-analytics/test-connection
    disabled_when: no_credentials

  - id: run_sync
    label: Run sync
    slot: settings_tab_footer
    style: primary
    icon: download
    endpoint: POST /api/plugins/voonix-analytics/sync-now
    confirm: "Sync from Voonix now?"
    disabled_when: sync_in_progress

  - id: backfill_older
    label: Fetch older history
    slot: plugin_page_header
    style: secondary
    icon: history
    endpoint: POST /api/plugins/voonix-analytics/backfill
    confirm: "Fetch another 12 months further back than what is stored? The Sync tab will show whether Voonix had older data."
    disabled_when: sync_in_progress
    visible_when: first_sync_success


setup_checklist:
  show_until: all_done
  items:
    - id: save_credentials
      label: Enter your Voonix address and API key
      done_if: credentials_saved
    - id: test_connection
      label: Verify connection — click "Test connection"
      done_if: last_test_success
    - id: first_sync
      label: Run the first sync
      done_if: first_sync_success
    - id: schedule_live
      label: Confirm automatic sync is scheduled
      done_if: schedule_active


frontend:
